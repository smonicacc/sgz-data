name: Fetch douyin user posts (example only DO NOT TRIGGER)

# Manual trigger only. Prepare captured/curl_p*.sh (one per paginated
# page, captured live from DevTools) before triggering — the workflow
# runs them verbatim via bash and parses the JSON responses.

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: 是否跳过 commit/PR（采集 + 推 Prometheus，但不写入 git）
        type: choice
        required: true
        default: 'false'
        options:
          - 'false'
          - 'true'

# Serialize manual runs: if you click "Run workflow" while a previous
# run is still in flight, the previous one is cancelled. Prevents two
# parallel jobs from racing on the auto/fetch-user-posts branch.
concurrency:
  group: fetch-user-posts
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-user-posts:
    runs-on: ubuntu-slim

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>sgz</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
#toolbar{display:flex;flex-direction:column;align-items:stretch;margin:10px 0 16px;font-family:sans-serif;font-size:18px;gap:28px;}
.toolbar-nav{display:flex;justify-content:flex-start;padding:8px 4px 12px;border-bottom:1px solid #e0e0e6;}
.toolbar-controls{display:flex;align-items:center;gap:16px;}
.toolbar-controls .toolbar-group:last-child{margin-left:auto;}
.toolbar-group{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;white-space:nowrap;}
#toolbar select{padding:8px 12px;font-size:20px;}
#refreshStatus{color:#888;font-size:13px;}
.nav-link{color:#475569;text-decoration:none;font-weight:500;font-size:18px;display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;}
/* 统一 link / visited / hover / active 四态颜色，避免浏览器默认 visited 蓝色干扰 */
.nav-link:link,.nav-link:visited,.nav-link:hover,.nav-link:active{color:#475569;text-decoration:none;}
/* SVG 图标：紫色圆底 + 白色回旋箭头，提示点击 */
.nav-emoji{display:inline-block;vertical-align:middle;margin-right:2px;}
#chart{width:100%;height:930px;}
/* 自定义 HTML 图例（top10 用）：ECharts 自带图例不支持横向多行，用 grid 4 列实现 */
#top10Legend{margin-top:12px;padding:12px 20px;background:#f5f5fa;border:1px solid #c9c9d6;border-radius:6px;display:none;}
/* font-family 与 ECharts textStyle 默认一致；font-size 用 16（比 ECharts 的 15 略大，
   因为系统 sans-serif 在 macOS 上（San Francisco）比 PingFang/Microsoft YaHei 视觉更紧凑） */
#top10Legend.show{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px;align-items:start;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','微软雅黑',Arial,sans-serif;font-size:16px;}
.legend-item{display:flex;align-items:flex-start;gap:8px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;outline:none;line-height:1.3;padding:8px 6px;border-radius:4px;font-size:16px;}
/* 取消 hover / active / focus 的任何前景/背景变化，保持 legend item 视觉始终一致（仅 .unselected 控制灰显） */
.legend-item:hover,.legend-item:active,.legend-item:focus,.legend-item:focus-visible{background:transparent;outline:none;}
/* 图例 marker：贯穿线 + 中间圆点（与"抖音话题播放数" ECharts 默认 line legend 一致） */
/* 用 currentColor 让 ::before/::after 继承 .marker 的 color，JS 只需 style="color:..." 即可 */
.legend-item .marker{display:inline-block;width:20px;height:12px;margin-top:8px;position:relative;flex-shrink:0;color:#000;}
.legend-item .marker::before{content:'';position:absolute;left:0;right:0;top:50%;height:0;border-top:2px solid currentColor;}
.legend-item .marker::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);border-radius:50%;background:currentColor;}
.legend-item .label{color:#333;word-break:break-all;}
/* 未选中：文字 + marker 统一变 #aaa（与 ECharts legend 默认 unselected 一致），用 !important 覆盖 inline 的 seriesColor */
.legend-item.unselected .label{color:#aaa;}
.legend-item.unselected .marker{color:#aaa !important;}
/* "全部" 特殊项：用方块 marker（无 line + dot）跟 series 区分开，active 时深色实心，否则灰色 */
.legend-item-all .marker{width:12px;height:12px;margin-top:8px;border-radius:2px;background:#333;flex-shrink:0;}
.legend-item-all .marker::before,.legend-item-all .marker::after{display:none;}
.legend-item-all .label{font-weight:500;}
.legend-item-all.unselected .marker{background:#aaa !important;}
/* ---- 抖音话题图例：固定两行（顺序由 JS 的 TOPIC_LEGEND_ROWS 决定），覆盖在折线图和柱状图之间 ---- */
#chartWrap{position:relative;}
#topicLegend{display:none;position:absolute;left:50%;transform:translateX(-50%);top:435px;z-index:2;width:max-content;background:#f5f5fa;border:1px solid #c9c9d6;border-radius:6px;padding:12px 20px;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','微软雅黑',Arial,sans-serif;max-width:calc(100% - 20px);}
.topic-legend-row{display:flex;align-items:center;justify-content:center;gap:18px 16px;flex-wrap:nowrap;}
.topic-legend-row + .topic-legend-row{margin-top:18px;}
.topic-legend-row .legend-item{align-items:center;padding:8px 6px;font-size:15px;line-height:1.3;}
.topic-legend-row .legend-item .label{white-space:nowrap;word-break:normal;}
.topic-legend-row .legend-item .marker{margin-top:0;}
@media (max-width:760px){
  /* 窄屏图例改为图表下方正常流式排列，避免两行/多行覆盖柱状图标题 */
  #topicLegend{position:static;left:auto;right:auto;transform:none;top:auto;margin:10px 0 0;width:auto;max-width:100%;padding:10px 12px;}
  .topic-legend-row{gap:18px 16px;flex-wrap:wrap;}
  .topic-legend-row .legend-item{padding:8px 6px;}
  .topic-legend-row + .topic-legend-row{margin-top:18px;}
  .topic-legend-row .legend-item .marker{width:16px;}
}
/* ---- 最近作品表格（A+D）：每行一个作品 + "发布后时长" sparkline ---- */
#recentControls{display:none;flex-direction:row;align-items:center;gap:24px;flex-wrap:wrap;font-family:sans-serif;font-size:16px;}
#recentControls select{padding:6px 10px;font-size:16px;}
#recentSummary{color:#666;font-size:14px;}
#recentTableWrap{display:none;margin-top:8px;margin-bottom:24px;border:1px solid #d7d7e0;border-radius:8px;overflow:visible;background:#fff;}
#recentTable{width:100%;border-collapse:separate;border-spacing:0;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;font-size:15px;}
#recentTable thead th{position:sticky;top:0;z-index:1;background:#f5f5fa;color:#444;font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid #d7d7e0;white-space:nowrap;}
#recentTable tbody td{padding:9px 14px;border-bottom:1px solid #eee;vertical-align:middle;}
#recentTable tbody tr:last-child td{border-bottom:none;}
#recentTable tbody tr:hover{background:#f8f9ff;}
.recent-title{max-width:420px;color:#222;}
.recent-title-main{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.recent-title-sub{display:none;color:#777;font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums;}
.recent-time{color:#555;white-space:nowrap;font-variant-numeric:tabular-nums;}
.recent-num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:#222;}
#recentTable thead th.recent-num{text-align:right;}
.recent-spark{width:220px;min-width:180px;padding-top:4px !important;padding-bottom:4px !important;}
.recent-spark svg{display:block;width:200px;height:44px;}
.recent-empty{color:#888;text-align:center;padding:28px 0 !important;}
.recent-muted{color:#aaa;font-size:13px;}
@media (max-width:760px){
  .recent-title{max-width:170px;}
  .recent-title-sub{display:block;}
  .recent-time-col{display:none;}
  .recent-spark{width:120px;min-width:100px;}
  .recent-spark svg{width:110px;height:38px;}
  #recentTable thead th,#recentTable tbody td{padding:7px 6px;}
  .recent-24h-col{display:none;}
}
</style>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-nav">
    <a href="./index.html" class="nav-link"><svg class="nav-emoji" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#8B5CF6"/><path d="M14.5 7l-5 5 5 5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>前往：预约热度数据</a>
  </div>
  <div class="toolbar-controls">
    <div class="toolbar-group">
      <label for="chartSelect">图表：</label>
      <select id="chartSelect">
        <option value="view" selected>&#127925;抖音话题播放数</option>
        <option value="user">&#127925;抖音话题参与人数</option>
        <option value="sgz">&#127925;尚公主抖音号</option>
        <option value="top10">&#127925;尚公主抖音-TOP10</option>
        <option value="recent">&#127925;尚公主抖音-最近作品</option>
        <option value="xhs">&#128213;小红书话题浏览数</option>
      </select>
    </div>
    <div class="toolbar-group" id="rangeGroup">
      <label for="rangeSelect">时间范围：</label>
      <select id="rangeSelect">
        <option value="3d" selected>最近3天</option>
        <option value="7d">最近7天</option>
        <option value="14d">最近14天</option>
        <option value="month:9">9月</option>
        <option value="month:10">10月</option>
        <option value="all">全部</option>
      </select>
      <span id="refreshStatus"></span>
    </div>
  </div>
  <div id="recentControls">
    <div class="toolbar-group">
      <label for="recentDaysSelect">发布窗口：</label>
      <select id="recentDaysSelect">
        <option value="7" selected>最近 7 天发布</option>
        <option value="14">最近 14 天发布</option>
        <option value="since">定档日起（10/17）</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label for="recentCurveSelect">曲线时间：</label>
      <select id="recentCurveSelect">
        <option value="24">发布后 24 小时</option>
        <option value="72" selected>发布后 72 小时</option>
        <option value="168">发布后 7 天</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label for="recentSortSelect">排序：</label>
      <select id="recentSortSelect">
        <option value="time" selected>发布时间</option>
        <option value="likes">点赞数</option>
      </select>
    </div>
    <span id="recentSummary"></span>
  </div>
</div>
<div id="chartWrap">
  <div id="chart"></div>
  <div id="topicLegend"></div>
</div>
<div id="top10Legend"></div>
<div id="recentTableWrap">
  <table id="recentTable">
    <thead>
      <tr>
        <th>作品</th>
        <th class="recent-time-col">发布时间</th>
        <th class="recent-num recent-24h-col" title="作品发布后约 24 小时时的点赞数；作品未满 24 小时或数据还没覆盖到 24 小时时显示占位文字">发布后24h赞</th>
        <th class="recent-num">当前赞</th>
        <th>发布后曲线</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
<script>
// ---- 状态 ----
let currentRange = '3d';
let currentMetric = 'view';  // 'view' = 抖音播放数(view_count)，'user' = 抖音参与人数(user_count)，'sgz' = 尚公主抖音号，'xhs' = 小红书话题浏览数(view_num)，'top10' = 抖音作品-点赞TOP10，'recent' = 抖音作品-最近作品（表格 + 发布后时长 sparkline）
let refreshTimer = null;
let allData = [];
let top10Data = {};  // {aweme_id: [{ts, digg_count, ...}, ...]} top10 / recent 共用
let metaData = {};   // {aweme_id: {desc, create_time, share_url}} recent 用
let recentWindow = '7';       // '7' / '14' = 最近 N 天发布；'since' = 定档日（10/17）起全部
const RECENT_SINCE_TS = new Date('2026-10-17T00:00:00+08:00').getTime() / 1000;  // 定档日 0 点（北京时间）
let recentCurveHours = 72;    // sparkline 横轴：发布后 N 小时
let recentSort = 'time';      // 最近作品排序：'time' = 发布时间，'likes' = 点赞数（均倒序）
let currentFiltered = [];
let currentRangeObj = null;

// ---- 系列基础配置：9 条抖音话题，前缀决定字段名 ----
// 播放数用原色，参与人数用更鲜艳的色以在白底区分
// 前缀对应 data/douyin.json 里的 {prefix}_douyin_tag_{view_count|user_count} 字段名
//   yqmr → #昀牵孟绕；sgz → #尚公主；fyzs → #扶摇直尚
//   mzylyr → #孟子义李昀锐；lyrmzy → #李昀锐孟子义
//   mzy → #孟子义；lyr → #李昀锐；mwy → #暮晚摇；ys → #言尚
// 9 个话题在 douyin.json / xhs_topic.json 中都有数据（xhs 字段为 {prefix}_tag_view_num）
const SERIES_BASE = [
  { name: '#昀牵孟绕', prefix: 'yqmr',
    viewColor: '#7D4698', viewBarColor: '#B197C4',
    userColor: '#7C3AED', userBarColor: '#C4B5FD' },
  { name: '#尚公主',  prefix: 'sgz',
    viewColor: '#c0392b', viewBarColor: '#E58B7E',
    userColor: '#DC2626', userBarColor: '#F87171' },
  { name: '#扶摇直尚', prefix: 'fyzs',
    viewColor: '#5794F2', viewBarColor: '#A8C5FA',
    userColor: '#2563EB', userBarColor: '#93C5FD' },
  { name: '#孟子义李昀锐', prefix: 'mzylyr',
    viewColor: '#16A34A', viewBarColor: '#86EFAC',
    userColor: '#059669', userBarColor: '#6EE7B7' },
  { name: '#李昀锐孟子义', prefix: 'lyrmzy',
    viewColor: '#EE2E84', viewBarColor: '#FECDD3',  // Tailwind rose-600 / rose-200（rose 比 pink 红更多/紫更少，更"粉"）
    userColor: '#DB2777', userBarColor: '#F472B6' }, // Tailwind pink-600 / pink-400
  { name: '#孟子义', prefix: 'mzy',
    viewColor: '#EA580C', viewBarColor: '#FDBA74',
    userColor: '#C2410C', userBarColor: '#FB923C' },
  { name: '#李昀锐', prefix: 'lyr',
    viewColor: '#0891B2', viewBarColor: '#67E8F9',
    userColor: '#0E7490', userBarColor: '#22D3EE' },
  { name: '#暮晚摇', prefix: 'mwy',
    viewColor: '#CA8A04', viewBarColor: '#FDE047',
    userColor: '#A16207', userBarColor: '#FACC15' },
  { name: '#言尚', prefix: 'ys',
    viewColor: '#64748B', viewBarColor: '#CBD5E1',
    userColor: '#475569', userBarColor: '#94A3B8' },
];

// 抖音 / 小红书话题图例的固定两行顺序（缺失的系列会自动过滤）
const TOPIC_LEGEND_ROWS = [
  ['#尚公主', '#扶摇直尚', '#暮晚摇', '#言尚'],
  ['#昀牵孟绕', '#孟子义李昀锐', '#李昀锐孟子义', '#孟子义', '#李昀锐'],
];

// ---- TOP10 配置：10 个作品 + 10 个高对比度色（白底明显）----
const TOP10_ITEMS = [
  { awemeId: '7544398141043477769', name: '0831开机风满楼大片' },
  { awemeId: '7675574770423050953', name: '七夕live图可爱*2' },
  { awemeId: '7621751828358880622', name: '250万预约天下第一好小墨镜双人照' },
  { awemeId: '7591450498210419633', name: '喵喵' },
  { awemeId: '7699564005504879912', name: '纯浴系' },
  { awemeId: '7518353962039561532', name: '0622官宣' },
  { awemeId: '7675334230276399793', name: '七夕看那边' },
  { awemeId: '7602668375747214153', name: '200万预约大婚' },
  { awemeId: '7698803308290428210', name: '倩女幽魂' },
  { awemeId: '7565794188832132362', name: '2025卖菜大会曳影夜话版预告' },
  // { awemeId: '7566890534225890619', name: '100万预约kiss' },
];

// ---- 最近作品：可选的短名称覆盖（只用于已手工命名的老作品；新作品自动用 meta 里的 desc）----
// 这是纯展示用的小映射，不再充当"要显示哪些作品"的白名单——列表由数据自动生成。
const NAME_OVERRIDES = {
  //'7697963430037334193': '500万预约视频',
  //'7697961173991378195': '500万预约雪地海报',
  //'7697710989726223625': '预告新剪24秒',
  //'7697634238824271147': '马车护头花絮',
  //'7697555703904341298': '450万预约双人海报',
  //'7697336857595579657': '定档花絮-一幕幕重现',
  //'7697336410742852883': '定档花絮-升温',
  //'7697336099026341139': '定档预告30秒片',
  //'7697335475178745273': '定档海报',
  //'7697333585769958719': '定档预告',
};

// 保底调色板：跟 TOP10_COLORS_BY_AWEME 全部 10 色都不重（hash 散到的色不会跟已有 id 撞色）
// 取 Tailwind 700/800/900 系列更深一档的色（BY_AWEME 用 600/700，这里用 700/800/900）
const TOP10_COLORS = [
  '#0369A1',  // sky
  '#1E40AF',  // dark blue
  '#166534',  // dark green
  '#4338CA',  // dark indigo
  '#92400E',  // dark amber
  '#155E75',  // dark cyan
  '#9D174D',  // dark rose
  '#3F6212',  // dark lime
  '#854D0E',  // dark yellow
  '#5B21B6',  // dark violet
];

// TOP10 的 aweme_id → 颜色 映射（最近作品表格不依赖颜色区分，所以只需要 top10 这 10 个）
// 未列入的 id 用 hash 散到 TOP10_COLORS 上（保底）
const TOP10_COLORS_BY_AWEME = {
  // Tailwind 600/700 亮色系，跟 TOP10_COLORS 保底调色板的 700/800/900 深色系不重
  '7675574770423050953': '#DC2626',  // red，TOP10[0]
  '7544398141043477769': '#16A34A',  // green，TOP10[1]
  '7621751828358880622': '#9333EA',  // purple，TOP10[2]
  '7591450498210419633': '#2563EB',  // blue，TOP10[3]
  '7518353962039561532': '#EA580C',  // orange，TOP10[4]
  '7675334230276399793': '#0891B2',  // cyan，TOP10[5]
  '7602668375747214153': '#DB2777',  // pink，TOP10[6]
  '7565794188832132362': '#65A30D',  // lime，TOP10[7]
  '7699564005504879912': '#B45309',  // amber，TOP10[8]
  '7698803308290428210': '#475569',  // slate，TOP10[9]
};

// djb2 字符串 hash，让未列入的 aweme_id 也保持稳定颜色（同一 id → 同一色）
function _hashAwemeId(id) {
  let h = 5381;
  for (let i = 0; i < id.length; i++) {
    h = ((h << 5) + h) + id.charCodeAt(i);  // h * 33 + c
    h |= 0;
  }
  return Math.abs(h);
}

// 查表：显式映射优先，未列入则 hash 散到 TOP10_COLORS 上（保底）
function getColorByAweme(awemeId) {
  if (TOP10_COLORS_BY_AWEME[awemeId]) return TOP10_COLORS_BY_AWEME[awemeId];
  return TOP10_COLORS[_hashAwemeId(awemeId) % TOP10_COLORS.length];
}

// ---- 通用：按当前指标返回要展示的 10 个作品 + series 列表 ----
// 只有 top10 用静态常量指定；最近作品列表由数据自动生成（见 buildRecentItems）
function getCurrentItems() {
  if (currentMetric === 'top10') return TOP10_ITEMS;
  return [];
}
function getDisplaySeries() {
  return getCurrentItems().map((item) => ({
    name: item.name,
    awemeId: item.awemeId,
    color: getColorByAweme(item.awemeId),
  }));
}
// 当前指标的图表标题（renderTop10Chart 引用）
function getSeriesChartTitle() {
  if (currentMetric === 'top10') return '抖音作品-点赞TOP10';
  return '';
}
// top10 默认勾选的下标（不再统一用 0）
const DEFAULT_SELECTED_INDEX = {
  top10: 1,     // 七夕live图可爱*2
};

// 默认勾选：只勾选当前指标对应下标的那一个，其他全 false
function getDefaultSelected() {
  const result = {};
  const items = getCurrentItems();
  const targetIdx = DEFAULT_SELECTED_INDEX[currentMetric] ?? 0;
  items.forEach((item, i) => { result[item.name] = i === targetIdx; });
  return result;
}

// ---- 最近作品（A+D）：自动列表 + "发布后时长" sparkline ----
// A：每个作品一行，行内 sparkline；D：横轴 = 发布后小时数（不是绝对时间），
// 这样发布 6 天的作品仍然展示它自己发布后头 72h 的曲线，也能和今天发的作品公平对比。
const BJ_TIME_FMT = new Intl.DateTimeFormat('zh-CN', {
  timeZone: 'Asia/Shanghai', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', hour12: false,
});
const COUNT_FMT = new Intl.NumberFormat('en-US');

// 抖音 aweme_id 高 32 位是发布时间（秒）。用 BigInt 避免 19 位数字在 Number 下丢精度。
function awemePublishTs(awemeId) {
  try {
    return Number(BigInt(awemeId) >> 32n);
  } catch (e) {
    return 0;
  }
}
function formatBJTime(ts) {
  return ts ? BJ_TIME_FMT.format(new Date(ts * 1000)) : '—';
}
function formatCount(n) {
  return n == null ? '—' : COUNT_FMT.format(n);
}

// 当前点赞数 = 最新一条快照的 digg_count
function latestDiggCount(records) {

// 发布后 hours 小时的点赞数：取离目标时间最近的已到达快照；还没到就返回 null
function valueAtAge(records, publishTs, hours) {
  const target = publishTs + hours * 3600;
  if (!records.length || records[records.length - 1].ts < target - 3600) return null;
  let best = null;
  let bestD = Infinity;
  for (const r of records) {
    if (r.ts > target + 2 * 3600) continue;
    const d = Math.abs(r.ts - target);

function _escHtml(s) {

}
// 每行一个 sparkline：x = 发布后小时数，y 按该行自身 min/max 自适应（绝对值见"当前赞"列）
function sparklineSvg(records, publishTs, windowHours) {
  const W = 200, H = 44, PAD_X = 3, PAD_Y = 6;
  const pts = records
    .filter(r => r.ts >= publishTs - 3600)  // 容忍 1h 时钟偏差
    .map(r => ({ age: Math.max(0, (r.ts - publishTs) / 3600), v: r.digg_count }))
    .filter(p => p.age <= windowHours);
  if (!pts.length) return '<span class="recent-muted">无数据</span>';
  if (pts.length === 1) {
    const px = PAD_X + (Math.min(pts[0].age, windowHours) / windowHours) * (W - PAD_X * 2);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="仅 1 个数据点">` +
      `<circle cx="${px.toFixed(1)}" cy="${(H / 2).toFixed(1)}" r="2.6" fill="#2563EB"></circle></svg>`;
  }
  const vals = pts.map(p => p.v);
  let vMin = Math.min(...vals);
  let vMax = Math.max(...vals);
  if (vMax === vMin) { vMax = vMin + 1; }
  const padV = (vMax - vMin) * 0.08;
  vMin -= padV;
  vMax += padV;
  const x = age => PAD_X + (Math.min(age, windowHours) / windowHours) * (W - PAD_X * 2);
  const y = v => PAD_Y + (1 - (v - vMin) / (vMax - vMin)) * (H - PAD_Y * 2);
  const coords = pts.map(p => [x(p.age), y(p.v)]);
  const line = coords.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
  const first = coords[0];
  const last = coords[coords.length - 1];
  const area = `${line} L${last[0].toFixed(1)},${H - PAD_Y} L${first[0].toFixed(1)},${H - PAD_Y} Z`;
  const firstV = pts[0].v;
  const lastV = pts[pts.length - 1].v;
  const summary = `发布后 ${pts[pts.length - 1].age.toFixed(1)}h：${formatCount(lastV)} 赞；区间 ${formatCount(firstV)} → ${formatCount(lastV)}`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${_escAttr(summary)}">` +
    `<title>${_escHtml(summary)}</title>` +
    `<line x1="${PAD_X}" y1="${H - PAD_Y}" x2="${W - PAD_X}" y2="${H - PAD_Y}" stroke="#eee" stroke-width="1"></line>` +
    `<path d="${area}" fill="#2563EB" fill-opacity="0.10"></path>` +
    `<path d="${line}" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>` +
    `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="#2563EB"></circle>` +
    `</svg>`;
}

// ---- 时间范围解析 ----
function parseRange(rangeValue) {
  if (rangeValue === '3d' || rangeValue === '7d' || rangeValue === '14d') {
    const days = rangeValue === '3d' ? 3 : rangeValue === '7d' ? 7 : 14;
    return {
      min: Date.now() - days * 86400 * 1000,
      max: Date.now(),
    };
  }
  const m = rangeValue.match(/^month:(\d+)$/);
  if (m) {
    const year = new Date().getFullYear();
    const month = parseInt(m[1], 10);  // 1-based
    return {
      // 月份用半开区间 [min, max)：10/1 0:00 这种"下月首条"算在 10月，不算在 9月
      min: new Date(year, month - 1, 1).getTime(),
      max: new Date(year, month, 1).getTime(),
      maxInclusive: false,
    };
  }
  if (rangeValue === 'all') return { min: -Infinity, max: Infinity };
  return { min: Date.now() - 3 * 86400 * 1000, max: Date.now() };
}

// 按 1 小时桶分桶（BJ 整点）
// mode='latest'：桶内取 ts 最大的记录（line 折点用，表示"截至桶末的累计值"）
// mode='first'：桶内取 ts 最小的记录（bar 用，表示"桶起点的瞬时值"）
// 用于 3d/7d：把十几分钟一条的数据合并到小时级，避免点过密
function bucketizeHourClosest(filtered, mode = 'latest') {
  const BJ_OFFSET = 8 * 3600;
  const buckets = new Map();
  for (const r of filtered) {
    const ms = r.ts * 1000 + BJ_OFFSET * 1000;
    const bjH = Math.floor(ms / 3600000);
    const keyUtc = bjH * 3600 - BJ_OFFSET;
    const arr = buckets.get(keyUtc) || [];
    arr.push(r);
    buckets.set(keyUtc, arr);
  }
  if (mode === 'closest') {
    return [...buckets.entries()].map(([key, arr]) => arr.reduce((best, r) => {
      const d = Math.abs(r.ts - key);
      const bd = Math.abs(best.ts - key);
      // 同距离时取 ts 较大的，让点偏向桶后半（与 latest 行为一致的方向）
      if (d < bd) return r;
      if (d === bd && r.ts > best.ts) return r;
      return best;
    }, arr[0]));
  }
  const cmp = mode === 'first'
    ? (best, r) => r.ts < best.ts ? r : best
    : (best, r) => r.ts > best.ts ? r : best;
  return [...buckets.entries()].map(([key, arr]) => arr.reduce(cmp, arr[0]));
}

// 按 4 小时桶分桶（BJ 0/4/8/12/16/20 点）
// mode='latest'：桶内取 ts 最大的记录（截至桶末的累计值）
// mode='first'：桶内取 ts 最小的记录（数据通常偏晚 1-2 分钟，所以 first ≈ 桶起点的瞬时值）
// mode='closest'：桶内取离桶边界 ts 最近的记录（保留原始 ts，不强制对齐到边界）
function bucketizeFourHourClosest(filtered, mode = 'latest') {
  const BJ_OFFSET = 8 * 3600;
  const buckets = new Map();
  for (const r of filtered) {
    const ms = r.ts * 1000 + BJ_OFFSET * 1000;
    const bjH = Math.floor(ms / 3600000);
    const evenH = bjH - (bjH % 4);
    const keyUtc = evenH * 3600 - BJ_OFFSET;
    const arr = buckets.get(keyUtc) || [];
    arr.push(r);
    buckets.set(keyUtc, arr);
  }
  if (mode === 'closest') {
    return [...buckets.entries()].map(([key, arr]) => arr.reduce((best, r) => {
      const d = Math.abs(r.ts - key);
      const bd = Math.abs(best.ts - key);
      // 同距离时取 ts 较大的，让点偏向桶后半（与 latest 行为一致的方向）
      if (d < bd) return r;
      if (d === bd && r.ts > best.ts) return r;
      return best;
    }, arr[0]));
  }
  const cmp = mode === 'first'
    ? (best, r) => r.ts < best.ts ? r : best
    : (best, r) => r.ts > best.ts ? r : best;
  return [...buckets.entries()].map(([key, arr]) => arr.reduce(cmp, arr[0]));
}

// 按 1 天桶分桶（BJ 零点）
// mode='latest'：桶内取 ts 最大的记录（截至桶末的累计值）
// mode='first'：桶内取 ts 最小的记录（数据通常偏晚 1-2 分钟，所以 first ≈ 桶起点的瞬时值）
// mode='closest'：桶内取离桶边界（BJ 0:00）ts 最近的记录（保留原始 ts，不强制对齐到边界）
function bucketizeDayClosest(filtered, mode = 'latest') {
  const BJ_OFFSET = 8 * 3600;
  const buckets = new Map();
  for (const r of filtered) {
    const ms = r.ts * 1000 + BJ_OFFSET * 1000;
    const bjH = Math.floor(ms / 3600000);
    const bjDayH = Math.floor(bjH / 24) * 24;
    const keyUtc = bjDayH * 3600 - BJ_OFFSET;
    const arr = buckets.get(keyUtc) || [];
    arr.push(r);
    buckets.set(keyUtc, arr);
  }
  if (mode === 'closest') {
    return [...buckets.entries()].map(([key, arr]) => arr.reduce((best, r) => {
      const d = Math.abs(r.ts - key);
      const bd = Math.abs(best.ts - key);
      // 同距离时取 ts 较大的，让点偏向桶后半（与 latest 行为一致的方向）
      if (d < bd) return r;
      if (d === bd && r.ts > best.ts) return r;
      return best;
    }, arr[0]));
  }
  const cmp = mode === 'first'
    ? (best, r) => r.ts < best.ts ? r : best
    : (best, r) => r.ts > best.ts ? r : best;
  return [...buckets.entries()].map(([key, arr]) => arr.reduce(cmp, arr[0]));
}

// ---- Y 轴范围：根据传入的系列数据计算 min/max ----
// pad = 10%；min 向下 round 到 1e6 倍数，max 向上 round
// 按数值量级自动选单位：>=1亿 → 亿；>=1万 → 万；否则原值
function pickUnit(maxAbs) {
  if (maxAbs >= 1e8) return { divisor: 1e8, unit: '亿' };
  if (maxAbs >= 1e4) return { divisor: 1e4, unit: '万' };
  return { divisor: 1, unit: '' };
}

// 把原始步长 round 到 1, 2, 5 × 10^n（nice number），避免大数量级 + 小变化被大步长放大
// 例：raw=90882 → 100000；raw=375 → 500；raw=12.5 → 20
function niceStep(raw) {
  if (raw <= 0) return 1;
  const exp = Math.floor(Math.log10(raw));
  const base = Math.pow(10, exp);
  const mantissa = raw / base;
  let nice;
  if (mantissa <= 1) nice = 1;
  else if (mantissa <= 2) nice = 2;
  else if (mantissa <= 5) nice = 5;
  else nice = 10;
  return nice * base;
}

function computeYRange(seriesArr) {
  const values = seriesArr.flatMap(s => s.data.map(d => d[1]));
  if (values.length === 0) return null;
  const vMin = Math.min(...values);
  const vMax = Math.max(...values);
  const range = vMax - vMin;
  const pad = range * 0.1 || vMin * 0.001;
  // 单位按 max 的量级自动选（max 决定刻度，min 不会让单位跳级）
  const { divisor, unit } = pickUnit(Math.max(Math.abs(vMax), Math.abs(vMin)));
  // 步长按数据实际变化范围算（除以 splitNumber），再 round 到 nice number
  // 旧版本用 divisor/10，对大数量级 + 小变化数据（如 fyzs 播放数 ~3.28亿，变化仅 72.7万）会把范围从 72.7万 拉到 1000万
  const splitNumber = 8;
  const rawStep = (range / splitNumber) || (divisor / 10);
  const step = niceStep(rawStep);
  return {
    min: Math.floor((vMin - pad) / step) * step,
    max: Math.ceil((vMax + pad) / step) * step,
    unit: { divisor, unit },
    step,
  };
}

// ---- 增量柱的 Y 轴范围：保证 0 在范围内，pad=10% ----
// bar data 是纯 value 数组（不是 [ts, val] 对），所以直接用 d 不用 d[1]
// 没负值时不向下 pad，避免 Y 轴多出一段没意义的负区间
function computeYBarRange(seriesArr) {
  const values = seriesArr.flatMap(s => s.data);
  if (values.length === 0) return null;
  const vMin = Math.min(0, ...values);
  const vMax = Math.max(0, ...values);
  const pad = (vMax - vMin) * 0.1 || 1;
  const { divisor, unit } = pickUnit(Math.max(Math.abs(vMax), Math.abs(vMin)));
  const step = divisor / 10;
  return {
    min: vMin < 0 ? Math.floor((vMin - pad) / step) * step : 0,
    max: Math.ceil((vMax + pad) / step) * step,
    unit: { divisor, unit },
  };
}

// 计算每桶相对前一桶的增量（data 是 [[ts, value], ...] 已按 ts 升序）
function computeDeltas(data) {
  return data.map((d, i) => [d[0], i === 0 ? 0 : d[1] - data[i - 1][1]]);
}

    if (currentRange !== '7d') return xLabelFormatter(val);

    if (d.getHours() !== 0) return '';
    return xLabelFormatter(val);
  };

  // 不调 clear()，让 setOption 直接接管整个 option（避免 legend 状态被清掉导致视觉上消失）
  subChart.setOption({
    animation: false,

      data: SGZ_SERIES.map(s => s.name),

    tooltip: {

      axisPointer: { type: 'cross', label: { backgroundColor: '#555' } },
      valueFormatter: v => v == null ? '-' : v.toLocaleString('en-US'),

        if (!params || !params.length) return '';
        const ts = params[0].axisValue;
        const dateStr = xLabelFormatter(ts);
        let html = `${dateStr}<br/>`;
        params.forEach(p => {

            Array.isArray(p.value) ? p.value[1].toLocaleString('en-US') :
            p.value.toLocaleString('en-US');
          html += `${p.marker} ${p.seriesName}: ${val}<br/>`;
        });
        return html;
      },
    },
    grid: { left: 70, right: 70, top: 100, bottom: 70 },
    xAxis: {

      min: Math.max(range.min, xMin),
      max: Math.min(range.max, xMax),
      axisLabel: { rotate: 30, hideOverlap: true, formatter: xTickFilter },

    yAxis: [
      {

        position: 'left',

// ---- 抖音作品-点赞TOP10 / 抖音作品-最新10 专用渲染：单 Y 轴折线图，10 条 series ----
// 数据从 data/user_posts_history.json 取（{aweme_id: records[]} 结构），每条 series 读一个 aweme_id 的 digg_count
// 复用 sgz 单图的网格布局（无柱状图，无双 Y 轴）；颜色按 TOP10_COLORS 数组分配
// 指标差异由 getDisplaySeries()/getCurrentItems()/getSeriesChartTitle() 体现，渲染逻辑共享

// ---- top10 自定义 HTML 图例（4 列 grid）----
// ECharts 图例不支持横向 wrap 到多行，用 HTML 网格实现 3-4 列布局；
// 点击 HTML item 通过 dispatchAction 触发 ECharts 内部状态切换，
// ECharts 的 legendselectchanged 事件 → applyLegendFilter → 同步 HTML 视觉 + 重算 Y 轴
function _escAttr(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderTop10Legend(selectedMap = {}) {
  const container = document.getElementById('top10Legend');
  if (!container) return;
  const series = getDisplaySeries();
  // "全部" 状态：10 条 series 全部勾选 → 显示为 active；否则按当前状态显示
  const allOn = series.every(s => selectedMap[s.name] !== false);
  const allItem = (
    '<div class="legend-item legend-item-all' + (allOn ? '' : ' unselected') + '" onclick="toggleSelectAll()">' +
    '<span class="marker"></span>' +
    '<span class="label">全部</span>' +
    '</div>'
  );
  const seriesItems = series.map(s => (
    '<div class="legend-item" data-name="' + _escAttr(s.name) + '" onclick="toggleTop10Series(\'' + _escAttr(s.name) + '\')">' +
    '<span class="marker" style="color:' + s.color + '"></span>' +
    '<span class="label">' + _escAttr(s.name) + '</span>' +
    '</div>'
  )).join('');
  container.innerHTML = allItem + seriesItems;
  // 同步各 series 的 unselected 状态（"全部"项的 class 已在 allItem 里根据 allOn 处理）
  syncTop10LegendHTML(selectedMap);
  container.classList.add('show');
}

function hideTop10Legend() {
  const container = document.getElementById('top10Legend');
  if (container) container.classList.remove('show');
}

function syncTop10LegendHTML(selectedMap) {
  const container = document.getElementById('top10Legend');
  if (!container) return;
  // "全部" 状态：所有 10 条都勾选 → active
  const allOn = getCurrentItems().every(item => selectedMap[item.name] !== false);
  const allEl = container.querySelector('.legend-item-all');
  if (allEl) allEl.classList.toggle('unselected', !allOn);
  // 各 series 状态
  container.querySelectorAll('.legend-item:not(.legend-item-all)').forEach(el => {
    el.classList.toggle('unselected', selectedMap[el.dataset.name] === false);
  });
}

// HTML 图例点击 → 触发 ECharts 内部切换；legendselectchanged 事件会自动同步 HTML 状态 + 重算 Y 轴
function toggleTop10Series(name) {
  if (currentMetric !== 'top10') return;
  subChart.dispatchAction({ type: 'legendToggleSelect', name });
}

// "全部" 切换：当前若不是 all-on → 全部勾选；若是 all-on → 恢复到默认（仅 DEFAULT_SELECTED_INDEX 项勾选）
function toggleSelectAll() {
  if (currentMetric !== 'top10') return;
  const items = getCurrentItems();
  const allOn = items.every(item => lastSelected[item.name] !== false);
  const newSelected = {};
  if (allOn) {
    // 全部已选 → 恢复默认（仅 DEFAULT_SELECTED_INDEX[currentMetric] 那一项勾选）
    const targetIdx = DEFAULT_SELECTED_INDEX[currentMetric] ?? 0;
    items.forEach((item, i) => { newSelected[item.name] = i === targetIdx; });
  } else {
    // 不是全部选中 → 全部选中
    items.forEach(item => { newSelected[item.name] = true; });
  }
  applyLegendFilter(newSelected);
}

function renderTop10Chart(range, selectedMap = {}) {
  const allSeries = getDisplaySeries();
  // 默认全选（selectedMap 未给某 series 时默认 true）
  const isSelected = (name) => selectedMap[name] !== false;
  // tooltip 用：seriesName → {awemeId, ...} 的查找表
  const seriesByName = {};
  allSeries.forEach(s => { seriesByName[s.name] = s; });

  // 每条 series：按时间范围过滤 + 按 currentRange 分桶
  const bucketed = allSeries.map(s => {
    const records = top10Data[s.awemeId] || [];
    // 时间过滤（与 applyRange 同样的半开区间逻辑）
    let filtered = records.filter(r => {
      const tsMs = r.ts * 1000;
      if (tsMs < range.min) return false;
      return range.maxInclusive === false
        ? tsMs < range.max
        : tsMs <= range.max;
    });
    // bucketize 函数对输入顺序无要求（按 ts 算桶），但 xMin/xMax 依赖 [0]/[length-1]，先升序排序保证两端是最早/最晚 ts
    filtered.sort((a, b) => a.ts - b.ts);
    if (currentRange === '3d') filtered = bucketizeHourClosest(filtered, 'closest');
    else if (currentRange === '7d') filtered = bucketizeFourHourClosest(filtered, 'closest');
    else if (currentRange === '14d' || currentRange === 'all' || /^month:/.test(currentRange)) filtered = bucketizeDayClosest(filtered, 'closest');
    return { ...s, data: filtered };
  });

  // 没有任何 series 有数据 → 空状态
  if (bucketed.every(s => s.data.length === 0)) {
    subChart.clear();
    subChart.setOption({
      title: { text: getSeriesChartTitle(), left: 'center', subtext: '该时间范围内无数据' },
    });
    lastSeriesBuckets = bucketed;
    lastSelected = selectedMap;
    return;
  }

  // X 轴范围：所有 series 的 [最早 ts, 最晚 ts] 并集
  let xMin = Infinity, xMax = -Infinity;
  for (const s of bucketed) {
    if (!s.data.length) continue;
    xMin = Math.min(xMin, s.data[0].ts * 1000);
    xMax = Math.max(xMax, s.data[s.data.length - 1].ts * 1000);
  }

  // Y 轴范围按当前选中的 series 算（legend 切换自适应）
  const visible = bucketed.filter(s => isSelected(s.name));
  const yRange = computeYRange(
    visible.map(s => ({ data: s.data.map(r => [r.ts * 1000, r.digg_count]) }))
  );

  const xLabelFormatter = (val) => {
    const d = new Date(val);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  const xTickFilter = (val) => {
    if (currentRange !== '7d') return xLabelFormatter(val);
    const d = new Date(val);
    if (d.getHours() !== 0) return '';
    return xLabelFormatter(val);
  };

  subChart.clear();
  subChart.setOption({
    animation: false,
    title: { text: getSeriesChartTitle(), left: 'center', top: 5 },
    legend: {
      // ECharts 自带图例不支持横向多行 wrap；图例改用下方 #top10Legend 的 HTML grid（4 列）渲染，
      // 这里只保留内部状态供 legendToggleSelect 等 action 使用，UI 隐藏。
      show: false,
      selected: selectedMap,
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', label: { backgroundColor: '#555' } },
      valueFormatter: v => v == null ? '-' : v.toLocaleString('en-US'),
      formatter: (params) => {
        if (!params || !params.length) return '';
        const ts = params[0].axisValue;
        const dateStr = xLabelFormatter(ts);
        let html = `${dateStr}<br/>`;
        params.forEach(p => {
          const val = p.value == null ? '-' :
            Array.isArray(p.value) ? p.value[1].toLocaleString('en-US') :
            p.value.toLocaleString('en-US');
          // tooltip 只显示 series 名字 + 数值，不附加 awemeId（用户确认不需要）
          html += `${p.marker} ${p.seriesName}: ${val}<br/>`;
        });
        return html;
      },
    },
    grid: { left: 70, right: 70, top: 50, height: 540 },
    xAxis: {
      type: 'time',
      min: Math.max(range.min, xMin),
      max: Math.min(range.max, xMax),
      axisLabel: { rotate: 30, hideOverlap: true, formatter: xTickFilter },
      axisLine: { show: true, lineStyle: { color: '#555' } },
    },
    yAxis: {
      type: 'value',
      name: '点赞数',
      min: yRange ? yRange.min : 0,
      max: yRange ? yRange.max : 1,
      interval: yRange ? yRange.step : undefined,
      splitNumber: 8,
      nameTextStyle: { color: '#888', fontSize: 12 },
      axisLine: { show: true, lineStyle: { color: '#555' } },
      axisLabel: {
        formatter: v => {
          const u = yRange ? yRange.unit : { divisor: 1, unit: '' };
          return (v / u.divisor).toFixed(3) + u.unit;
        },
      },
    },
    series: bucketed.map(s => ({
      name: s.name,
      type: 'line',
      data: s.data.map(r => [r.ts * 1000, r.digg_count]),
      smooth: false,
      symbol: 'circle',
      symbolSize: 4,
      lineStyle: { width: 2, color: s.color },
      itemStyle: { color: s.color },
      emphasis: { focus: 'none' },
    })),
  }, true);

  // 缓存给 legend 切换使用
  lastSeriesBuckets = bucketed;
  lastSelected = selectedMap;
}

// ---- 折线 + 柱状图渲染（同一 chart，两个 grid）----
function renderChart(baseFiltered, range, selectedMap = {
  '#尚公主': true,
  '#昀牵孟绕': false,
  '#扶摇直尚': false,
  '#孟子义李昀锐': false,
  '#李昀锐孟子义': false,
  '#孟子义': false,
  '#李昀锐': false,
  '#暮晚摇': false,
  '#言尚': false,
}) {
  if (!baseFiltered.length) {
    subChart.clear();
    subChart.setOption({
      title: { text: getChartMeta().lineTitle, left: 'center', subtext: '该时间范围内无数据' },
    });
    hideTopicLegend();
    return;
  }

  // 折线时间桶：3d → 1h（最小粒度）；7d → 4h（对齐 BJ 0/4/8/12/16/20）；14d/month/all → 1d
  let lineData = baseFiltered;
  if (currentRange === '3d') {
    lineData = bucketizeHourClosest(baseFiltered, 'closest');
  } else if (currentRange === '7d') {
    lineData = bucketizeFourHourClosest(baseFiltered, 'closest');
  } else if (currentRange === '14d' || currentRange === 'all' || /^month:/.test(currentRange)) {
    lineData = bucketizeDayClosest(baseFiltered, 'closest');
  }

  // category 轴：直接喂格式化好的字符串给 ECharts
  // X 轴 label 对齐到桶边界时刻（不取桶内数据点）—— 4h 桶 → 0/4/8/12/16/20；1d 桶 → 0:00
  const isDayBucket = (currentRange === '14d' || currentRange === 'all' || /^month:/.test(currentRange));
  const BJ_OFFSET = 8 * 3600;
  const bucketBoundaryUtc = (ts) => {
    const ms = ts * 1000 + BJ_OFFSET * 1000;
    const bjH = Math.floor(ms / 3600000);
    const bucketH = isDayBucket ? Math.floor(bjH / 24) * 24 : bjH - (bjH % 4);
    return bucketH * 3600 - BJ_OFFSET;
  };
  const fmtTick = (val) => {
    const d = new Date(val);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  // 柱状时间桶：≤7d → 4h；>7d（含 14d/month/all） → 1d（独立于折线桶）
  // bar 用 first 模式：取桶起点（≈ 桶边界时刻）作为桶代表值
  // 例：4h 桶 "0:00" 的代表值 = first-after-0:00 的记录值；bar at X = "X → X+step 增量"
  // 桶归属按"窗口结束时刻 endBoundary"决定（用户确认 9/30 的 bar 归到 10月）。
  // 注意：bar 桶从 allData 而非 baseFiltered 取，这样 10月视图能拿到 9/30 桶
  // （其记录在 9月 filter 内，但 END=10/1 在 10月），由下面的 END filter 收口。
  const bucketStepSec = isDayBucket ? 24 * 3600 : 4 * 3600;
  const rangeMinSec = range.min / 1000;
  const rangeMaxSec = range.max / 1000;
  // 最后一个有效记录的 ts（秒）——用于判断 partial 末位桶 + barXCategories 标签 fallback。
  const lastDataTsSec = allData.length ? allData[allData.length - 1].ts : 0;
  const isMonthRange = /^month:/.test(currentRange);
  const allBarBuckets = (isDayBucket)
    ? bucketizeDayClosest(allData, 'first')
    : bucketizeFourHourClosest(allData, 'first');
  const barData = allBarBuckets.filter(b => {
    const endBoundary = bucketBoundaryUtc(b.ts) + bucketStepSec;
    // 月度：endBoundary 必须严格小于 rangeMax（半开区间）。9/30 桶 endBoundary=10/1 = rangeMax，
    // 落到 10月，不进 9月。
    // 非月度（3d/14d/all 等）：允许 partial 末位桶超出 rangeMax 不超过 1 step。
    if (endBoundary < rangeMinSec) return false;
    if (isMonthRange) {
      if (endBoundary >= rangeMaxSec) return false;
    } else {
      if (endBoundary > rangeMaxSec + bucketStepSec) return false;
    }
    // 排除"末位不满桶"：endBoundary 之后没有数据（endBoundary > lastDataTsSec），
    // 即当前窗口的时间还没走完就停在这了。这种 bar 不显示（用户确认）。
    if (endBoundary > lastDataTsSec) return false;
    return true;
  });

  // bar X 轴 label：endBoundary（窗口结束时刻），与桶归属同源。
  //   - 4h 桶："10/5 16:00" = "12→16 增量"。
  //   - 1d 桶："9/24 00:00" = "9/23 0→9/24 0 增量"。
  //   - partial bar：endBoundary 还没到时退回 lastDataTsSec，避免显示未来时刻。
  const barXCategories = barData.map(b => {
    const endBoundary = bucketBoundaryUtc(b.ts) + bucketStepSec;
    const labelTs = endBoundary > lastDataTsSec ? lastDataTsSec : endBoundary;
    return fmtTick(labelTs * 1000);
  });

  // 计算 3 条系列的数据（折线：原始值；柱状：X → X+step 的增量）
  const seriesData = getSeries().map(s => ({
    ...s,
    data: lineData
      .filter(r => r[s.field] != null)
      .map(r => [r.ts * 1000, r[s.field]]),
  }));
  const barSeriesData = getSeries().map(s => {
    const field = s.field;
    // 在 allData 里找"boundary 之后最近"的值。
    // 如果 boundary 之后没有数据（最后一个桶还没跑完），fallback 到全数据最后一条 → 显示"截至当前"的增量
    // 同时也支持 boundary 之前没数据的情况：返回第一个有该 field 的值（用于新加话题的稀疏数据）
    const findFirstAfter = (boundary) => {
      let lastVal = null;
      for (const r of allData) {
        if (r[field] != null) {
          lastVal = r[field];
          if (r.ts * 1000 >= boundary * 1000) return r[field];
        }
      }
      return lastVal;
    };
    // category 轴下 bar data 用纯 value（按索引对齐到 barXCategories），不再带 [ts, val] 对
    // startVal 也用 findFirstAfter 而非 b[field]：
    //   b 是桶里 ts 最小的那条，但那条可能不带本 field（新话题稀疏数据时常见），
    //   改成"桶起点之后第一个有该 field 的值"才能算到正确的增量
    const deltas = barData.map(b => {
      const startBoundary = bucketBoundaryUtc(b.ts);
      const startVal = findFirstAfter(startBoundary);
      const endBoundary = startBoundary + bucketStepSec;
      const endVal = findFirstAfter(endBoundary);
      if (startVal == null || endVal == null) return 0; // 该 field 完全没数据
      return endVal - startVal;
    });
    return { ...s, data: deltas };
  });

  // Y 轴范围按当前选中系列算
  const initialLine = seriesData.filter(s => selectedMap[s.name]);
  const initialBar = barSeriesData.filter(s => selectedMap[s.name]);
  const yRange = computeYRange(initialLine);
  const yBarRange = computeYBarRange(initialBar);

  // X 轴 min/max（用折线数据的时间范围，与 bar 共享）
  const xMin = lineData[0].ts * 1000;
  const xMax = lineData[lineData.length - 1].ts * 1000;

  // 缓存给 legend 切换使用
  lastSeriesData = seriesData;
  lastBarSeriesData = barSeriesData;

  const xLabelFormatter = (val) => {
    const d = new Date(val);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };

  // 7d 折线/柱状用 4h 桶，标签太密；只在 BJ 0:00 显示（每 24h 一根）
  const xTickFilter = (val) => {
    if (currentRange !== '7d') return xLabelFormatter(val);
    const d = new Date(val);
    if (d.getHours() !== 0) return '';
    return xLabelFormatter(val);
  };

  subChart.clear();
  subChart.setOption({
    animation: false,
    title: [
      { text: getChartMeta().lineTitle, left: 'center', top: 5 },
      { text: getChartMeta().barTitle, left: 'center', top: 570 },
    ],
    legend: {
      // view/user/xhs 用下方 #topicLegend 的 HTML 两行布局，这里只隐藏但保留内部状态
      show: false,
      top: 435,
      left: 'center',
      data: getSeries().map(s => s.name),
      textStyle: { fontSize: 14 },
      // 背景 + 浅边框让 legend 区视觉上突出，引导用户点击
      backgroundColor: '#f5f5fa',
      borderColor: '#c9c9d6',
      borderWidth: 1,
      borderRadius: 6,
      padding: [10, 18],
      itemGap: 18,
      itemWidth: 18,
      itemHeight: 12,
      selected: selectedMap,
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', label: { backgroundColor: '#555' } },
      valueFormatter: v => v == null ? '-' : v.toLocaleString('en-US'),
      // 折线 axisValue 是 ts 毫秒，柱状 axisValue 已是格式化字符串；按 series 实际类型区分
      formatter: (params) => {
        if (!params || !params.length) return '';
        const firstSeries = params[0];
        // 柱状图 series 的 data 形态是纯 value（按索引对齐 category），所以对应 axisValue 是字符串
        const isBar = firstSeries.seriesType === 'bar';
        let dateStr;
        if (isBar) {
          // 取这个 category 对应的真实时间戳：找到第一个 line 系列，用它的 data[xAxisIndex==0 的 idx 转换] 反推不可行，
          // 简单做法：直接从 fmtTick 反向——这里直接用 axisValueLabel
          dateStr = String(firstSeries.axisValueLabel ?? firstSeries.axisValue);
        } else {
          dateStr = xLabelFormatter(firstSeries.axisValue);
        }
        let html = `${dateStr}<br/>`;
        params.forEach(p => {
          const val = p.value == null ? '-' :
            Array.isArray(p.value) ? p.value[1].toLocaleString('en-US') :
            p.value.toLocaleString('en-US');
          html += `${p.marker} ${p.seriesName}: ${val}<br/>`;
        });
        return html;
      },
    },
    grid: [
      { left: 70, right: 30, top: 55, height: 290 },   // 折线（自带 X 轴在底部）
      { left: 70, right: 30, top: 615, height: 280 },  // 柱状（自带 X 轴在底部）
    ],
    xAxis: [
      {
        type: 'time',
        gridIndex: 0,
        min: Math.max(range.min, xMin),
        max: Math.min(range.max, xMax),
        axisLabel: {
          rotate: 30,
          hideOverlap: true,
          formatter: xTickFilter,
        },
        axisLine: { show: true, lineStyle: { color: '#555' } },
      },
      {
        type: 'category',
        gridIndex: 1,
        data: barXCategories,
        axisLabel: {
          rotate: 30,
          hideOverlap: false,
          // 按"日期切换处"过滤：每个跨日的那根显示一次，一天一根（之前的 / 00:00$/ 在改成
          // 显示数据点时间后失效，因为数据点时间是 23:15、03:15 之类，不在整点）
          interval: (idx) => {
            if (idx === 0) return true;
            const prevDay = barXCategories[idx - 1].split(' ')[0];
            const currDay = barXCategories[idx].split(' ')[0];
            return prevDay !== currDay;
          },
          formatter: (val) => val,
        },
        axisLine: { show: true, lineStyle: { color: '#555' } },
      },
    ],
    yAxis: [
      {
        type: 'value',
        gridIndex: 0,
        position: 'left',
        min: yRange ? yRange.min : 0,
        max: yRange ? yRange.max : 1,
        // 显式 interval：阻止 ECharts 因 niceTick 进一步扩展 min/max
        interval: yRange ? yRange.step : undefined,
        splitNumber: 8,
        axisLine: { show: true, lineStyle: { color: '#555' } },
        axisLabel: {
          formatter: v => {
            const u = yRange ? yRange.unit : { divisor: 1, unit: '' };
            return (v / u.divisor).toFixed(3) + u.unit;
          },
        },
      },
      {
        type: 'value',
        gridIndex: 1,
        position: 'left',
        min: yBarRange ? yBarRange.min : 0,
        max: yBarRange ? yBarRange.max : 1,
        splitNumber: 6,
        // 柱状分桶：≤7d 是 4h 桶，14d/all 是 1d 桶，单位名跟着变
        name: (currentRange === '14d' || currentRange === 'all' || /^month:/.test(currentRange)) ? '/天' : '/4小时',
        nameLocation: 'end',
        nameGap: 8,
        nameTextStyle: { color: '#888', fontSize: 12 },
        axisLine: { show: true, lineStyle: { color: '#555' } },
        axisLabel: {
          formatter: v => {
            const u = yBarRange ? yBarRange.unit : { divisor: 1, unit: '' };
            return (v / u.divisor).toFixed(0) + u.unit;
          },
        },
      },
    ],
    series: [
      // 折线（顶）
      ...seriesData.map(s => ({
        name: s.name,
        type: 'line',
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: s.data,
        smooth: false,
        symbol: 'circle',
        symbolSize: 4,
        lineStyle: { width: 2, color: s.color },
        itemStyle: { color: s.color },
        // focus: 'none' 阻止鼠标 hover legend 时其他 series 变灰
        emphasis: { focus: 'none' },
      })),
      // 柱状（底）—— 同一 name 的 line + bar 在 legend 上是同一条
      // 只放选中的 bar series：隐藏的 series 不参与 ECharts 的 group 布局，否则 1 条可见也会被分到 1/3 槽宽
      // barWidth 按可见 series 数动态算：1 条 80%，2 条各 40%，3 条各 27%，刚好填满 80% 槽宽，不重叠
      ...(() => {
        const visibleBar = barSeriesData.filter(s => selectedMap[s.name]);
        const n = visibleBar.length || 1;
        const perBarPct = Math.floor(80 / n);
        return visibleBar.map(s => ({
          name: s.name,
          type: 'bar',
          xAxisIndex: 1,
          yAxisIndex: 1,
          data: s.data,
          itemStyle: { color: s.barColor },
          barWidth: `${perBarPct}%`,
          barCategoryGap: '0%',
          barGap: '0%',
        }));
      })(),
    ],
  }, true);

  // view/user/xhs：显示固定两行的 HTML 图例
  if (usesTopicLegend()) {
    renderTopicLegend(selectedMap);
  } else {
    hideTopicLegend();
  }
}

// ---- legend 点击 → 折线和柱状两个 Y 轴范围都跟着所选系列自适应 ----
// 同时重建 bar series 数组，只放选中的；隐藏的 series 不进 series 数组，
// 缓存最近一次渲染的系列数据（含 data），供 legend 切换时重算 Y 轴范围
let lastSeriesData = [];
let lastBarSeriesData = [];
// sgz 图表的 legend 选中状态（独立于 view/user 的 selectedMap）
let lastSgzSelected = { '总获赞': true, '粉丝数': true };
// top10 图表的缓存：分桶后的系列数据 + legend 选中状态
// 初始默认：只勾选 items[DEFAULT_SELECTED_INDEX]，其他全 false
let lastSeriesBuckets = [];
let lastSelected = getDefaultSelected();

// 这样 ECharts 的 group 布局就不会把它算进去，可见 bar 能真正拿到 80% 槽宽
// 直接重画整个图（notMerge: true），强制 ECharts 重新算布局
function applyLegendFilter(selectedMap) {
  if (currentMetric === 'top10') {
    // top10：chart.series 永远包含全部 10 条（不让 ECharts 把 legend item 当孤儿处理掉），
    // legend 可见性由 legend.selected 控制，这里只重算 Y 轴范围 + 更新 legend.selected。
    // 不重画整个 chart，避免 ECharts 重新构造 legend 时把当前 unselected 的 item 移除。
    lastSelected = selectedMap;
    const isSelected = (name) => selectedMap[name] !== false;
    const visible = lastSeriesBuckets.filter(s => isSelected(s.name));
    const yRange = computeYRange(
      visible.map(s => ({ data: s.data.map(r => [r.ts * 1000, r.digg_count]) }))
    );
    // 同步 HTML 图例视觉：被取消勾选的 item 加 .unselected（文字+marker 变 #aaa）
    syncTop10LegendHTML(selectedMap);
    subChart.setOption({
      legend: { selected: selectedMap },
      yAxis: {
        min: yRange ? yRange.min : 0,
        max: yRange ? yRange.max : 1,
        interval: yRange ? yRange.step : undefined,
        axisLabel: {
          formatter: v => {
            const u = yRange ? yRange.unit : { divisor: 1, unit: '' };
            return (v / u.divisor).toFixed(3) + u.unit;
          },
        },
      },
    });
  } else if (currentMetric === 'sgz') {
    // sgz 用 ECharts 默认的 legend 行为（点 legend 自动隐藏 series），不动整图。
    // 只用局部 setOption 把对应 Y 轴隐藏，并显式带上 splitNumber + splitLine.lineStyle，
    // 避免 splitLine 配置在切换时被覆盖
    lastSgzSelected = selectedMap;
    const leftSelected = selectedMap['总获赞'] !== false;
    const rightSelected = selectedMap['粉丝数'] !== false;
    subChart.setOption({
      legend: { selected: selectedMap },
      yAxis: [
        {
          show: leftSelected,
          axisLine: { show: leftSelected, lineStyle: { color: '#4b7ae2' } },
          axisLabel: { show: leftSelected, color: '#4b7ae2' },
          nameTextStyle: { color: '#4b7ae2', fontSize: 12 },
          splitNumber: 8,
          splitLine: { show: leftSelected, lineStyle: { color: '#eee' } },
        },
        {
          show: rightSelected,
          axisLine: { show: rightSelected, lineStyle: { color: '#FF9900' } },
          axisLabel: { show: rightSelected, color: '#FF9900' },
          nameTextStyle: { color: '#FF9900', fontSize: 12 },
          splitNumber: 8,
          splitLine: { show: false },
        },
      ],
    });
  } else {
    renderChart(currentFiltered, currentRangeObj, selectedMap);
  }
}

// ---- 应用当前范围 ----
function applyRange() {
  if (currentMetric === 'recent') {
    // A+D：隐藏 ECharts 单图，显示"作品表格 + 发布后时长 sparkline"
    chartDom.style.display = 'none';
    hideTop10Legend();
    hideTopicLegend();
    rangeGroup.style.display = 'none';
    recentControls.style.display = 'flex';
    recentTableWrap.style.display = 'block';
    renderRecentTable();
    return;
  }
  chartDom.style.display = 'block';
  rangeGroup.style.display = 'flex';
  recentControls.style.display = 'none';
  recentTableWrap.style.display = 'none';

  currentRangeObj = parseRange(currentRange);
  // 只按时间范围过滤，分桶交给 renderChart（折线/柱状各自决定）
  currentFiltered = allData.filter(r => {
    const tsMs = r.ts * 1000;
    if (tsMs < currentRangeObj.min) return false;
    // 月份用半开区间 [min, max)，避免下月首条记录被重复计入上月
    return currentRangeObj.maxInclusive === false
      ? tsMs < currentRangeObj.max
      : tsMs <= currentRangeObj.max;
  });
  if (currentMetric === 'sgz') {
    // sgz 是单图，把 chart 容器缩小到 560px（双图模式是 930px）
    chartDom.style.height = '560px';
    subChart.resize();
    renderSgzChart(currentFiltered, currentRangeObj, lastSgzSelected);
    hideTop10Legend();
    hideTopicLegend();
  } else if (currentMetric === 'top10') {
    // top10 单图：图例改用下方 HTML grid 多行布局，chart 容器只需装下图表本身
    chartDom.style.height = '700px';
    subChart.resize();
    renderTop10Chart(currentRangeObj, lastSelected);
    renderTop10Legend(lastSelected);
    hideTopicLegend();
  } else {
    chartDom.style.height = '1000px';
    subChart.resize();
    renderChart(currentFiltered, currentRangeObj);
    hideTop10Legend();
  }
}

// ---- 自动刷新 ----
function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(async () => {
    await loadData();
    refreshStatus.textContent = `自动刷新中…（${new Date().toLocaleTimeString()}）`;
  }, 60000);
  refreshStatus.textContent = `自动刷新中…（${new Date().toLocaleTimeString()}）`;
}
function stopAutoRefresh() {
  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
  refreshStatus.textContent = '已停止自动刷新';
}

// ---- 数据加载 ----
async function loadData() {
  if (currentMetric === 'top10' || currentMetric === 'recent') {
    // top10 / recent 共用数据源：{aweme_id: records[]}，加载到 top10Data（不写入 allData）
    const histUrl = './data/user_posts_history.json?t=' + Date.now();
    if (currentMetric === 'recent') {
      // recent 额外加载 meta（标题 + 发布时间）；文件缺失时降级到 id 推导
      const [histRes, metaRes] = await Promise.all([
        fetch(histUrl),
        fetch('./data/user_posts_meta.json?t=' + Date.now()).catch(() => null),
      ]);
      top10Data = await histRes.json();
      metaData = (metaRes && metaRes.ok) ? await metaRes.json() : {};
    } else {
      const res = await fetch(histUrl);
      top10Data = await res.json();
      // 如果 lastSelected 跟当前 items 对不上（首次进入 / 切换指标），重置为默认
      const items = getCurrentItems();
      const needReset = items.length === 0 || items.some(it => !(it.name in lastSelected));
      if (needReset) {
        lastSelected = getDefaultSelected();
      }
    }
  } else {
    // xhs 指标走单独的 xhs_topic.json（字段名 {prefix}_tag_view_num，无 douyin_ 中缀）
    const file = currentMetric === 'xhs' ? './xhs_topic.json' : './douyin.json';
    const res = await fetch(file + '?t=' + Date.now());
    allData = await res.json();
  }
  applyRange();
}

// ---- 初始化 ----
const chartSelect = document.getElementById('chartSelect');
chartSelect.addEventListener('change', () => {
  currentMetric = chartSelect.value;
  // recent 不依赖全局时间范围，始终自动刷新；其他指标沿用"只有最近 3 天自动刷新"
  if (currentMetric === 'recent' || currentRange === '3d') {
    startAutoRefresh();
  } else {
    stopAutoRefresh();
  }
  // 切换指标时数据源可能变（recent 走 user_posts_history.json，xhs 走 xhs_topic.json，其他走 douyin.json），重新加载
  loadData();
});

recentDaysSelect.addEventListener('change', () => {
  recentWindow = recentDaysSelect.value === 'since'
    ? 'since'
    : String(parseInt(recentDaysSelect.value, 10) || 7);
  if (currentMetric === 'recent') renderRecentTable();
});
recentCurveSelect.addEventListener('change', () => {
  recentCurveHours = parseInt(recentCurveSelect.value, 10) || 72;
  if (currentMetric === 'recent') renderRecentTable();
});

recentSortSelect.addEventListener('change', () => {
  recentSort = recentSortSelect.value === 'likes' ? 'likes' : 'time';
  if (currentMetric === 'recent') renderRecentTable();
});

rangeSelect.addEventListener('change', () => {
  currentRange = rangeSelect.value;
  // 只有最近 3 天自动刷新，其他范围（含 7d / 14d / all）都停止
  if (currentRange === '3d') {
    startAutoRefresh();
  } else {
    stopAutoRefresh();
  }
  applyRange();
});

loadData().then(() => startAutoRefresh());

// legend 切换 → Y 轴范围自适应（仅保留当前勾选系列的数值范围）
subChart.on('legendselectchanged', (params) => {
  applyLegendFilter(params.selected);
});

window.addEventListener('resize', () => subChart.resize());
</script>
